services:
  ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sj-seed/ai:latest
    env_file:
      - .env
    ports:
      - '8000:8000'
    init: true
    restart: unless-stopped

  postgres:
    image: postgres:16
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
